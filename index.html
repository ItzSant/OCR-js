<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR para Vouchers - OCR.space</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1a252f;
      margin-bottom: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
      justify-content: center;
      background: #eef2f7;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
    }
    input[type="text"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 150px;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
      height: 38px;
    }
    button:hover {
      background-color: #2980b9;
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    .viewer {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .panel {
      flex: 1;
      min-width: 300px;
      text-align: center;
    }
    .panel h3 {
      margin-top: 0;
      color: #2c3e50;
    }
    canvas, img {
      max-width: 100%;
      height: auto;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      background-color: #fff;
    }
    .ocr-section {
      background: #fdfefe;
      border: 1px solid #e1e8ed;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    #ocrResult {
      width: 100%;
      height: 250px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
    }
    #progressText {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ExtracciÃ³n de Texto - API OCR</h1>

    <div class="controls">
      <div class="control-group">
        <label for="imageInput">1. Seleccionar Voucher:</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="control-group">
        <label>&nbsp;</label>
        <button type="button" id="btnTomarFoto">ðŸ“· Tomar Foto</button>
        <!-- Input oculto con capture="environment": en celulares abre la camara trasera directamente -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
      </div>

      <div class="control-group">
        <label for="apiKey">API Key (OCR.space):</label>
        <input type="text" id="apiKey" value="helloworld" placeholder="Ingresa tu API Key">
      </div>

      <div class="control-group">
        <button id="btnExtraerTexto" disabled>2. Extraer Texto</button>
      </div>
    </div>

    <div class="viewer">
      <div class="panel">
        <h3>Imagen Cargada</h3>
        <img id="originalImage" alt="Carga una imagen..." style="display:none;">
      </div>
    </div>

    <div class="ocr-section">
      <h3>Resultado de ExtracciÃ³n</h3>
      <div id="progressText"></div>
      <textarea id="ocrResult" placeholder="El texto extraÃ­do aparecerÃ¡ aquÃ­..." readonly></textarea>
    </div>

    <div class="ocr-section">
      <h3>Resultado de Extracción (Texto Raw)</h3>
      <div id="progressText"></div>
      <textarea id="ocrResult" placeholder="El texto extraído aparecerá aquí..." readonly></textarea>
    </div>

    <!-- NUEVA SECCIÓN PARA EL JSON -->
    <div class="ocr-section" style="margin-bottom: 40px;">
      <h3>Datos Estructurados (JSON)</h3>
      <textarea id="jsonResult" placeholder="El JSON formateado aparecerá aquí..." readonly style="width: 100%; height: 250px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 14px; resize: vertical; box-sizing: border-box; background-color: #f8f9fa; color: #2c3e50;"></textarea>
    </div>

  </div>

  <!-- Canvas oculto: se usa solo internamente para generar el Base64 que se envÃ­a a la API -->
  <canvas id="outputCanvas" style="display:none;"></canvas>

  <script src="script.js"></script>
</body>
</html>
